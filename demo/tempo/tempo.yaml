# Single-binary Tempo, local storage. Demo shape.
server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 24h

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

# Generates RED metrics from spans and writes them to Prometheus.
#
# Worth understanding before trusting: these are derived from SAMPLED traces, so
# they are an estimate. The SDK metrics this repo already collects are exact.
# Where the two disagree, the SDK metrics are right — span metrics are for
# breaking latency down BY SPAN, not for SLIs.
metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics]
