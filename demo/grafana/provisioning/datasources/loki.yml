apiVersion: 1

datasources:
  - name: Loki
    type: loki
    access: proxy
    uid: loki
    url: http://loki:3100
    jsonData:
      maxLines: 1000
      # Derived fields turn an ID in a log line into a clickable link, which is
      # the whole point of shipping logs alongside these metrics: metrics say
      # "something is stuck", logs say which execution, and this jumps you
      # straight to it.
      derivedFields:
        - name: WorkflowID
          matcherRegex: '(?:WorkflowID|workflow_id|wf-id)[=:\s"]+([\w\-\.:@]+)'
          url: 'http://localhost:8080/namespaces/default/workflows/${__value.raw}'
          urlDisplayLabel: 'Open in Temporal UI'
        - name: RunID
          matcherRegex: '(?:RunID|run_id|wf-run-id)[=:\s"]+([\w\-]+)'
          url: 'http://localhost:8080/namespaces/default/workflows/${__value.raw}'
          urlDisplayLabel: 'Run'
