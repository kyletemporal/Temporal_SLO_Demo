apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    # Fixed UID. The community dashboard importer rewrites every datasource
    # reference to point here, so this value must not drift.
    uid: prometheus
    jsonData:
      timeInterval: 10s
      httpMethod: POST
