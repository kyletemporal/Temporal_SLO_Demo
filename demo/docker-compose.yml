# name is set below; every image tag is overridable so you can run this against
# whatever Temporal version you actually need to reproduce.
#
#   TEMPORAL_VERSION=1.27.4 ./deploy.sh --clean     # or edit .env
#
# Defaults live in the ${VAR:-default} expressions, so no .env file is required.
# See .env.example for the full list and the version caveats.
#
# CHANGING THE VERSION REQUIRES A CLEAN START. The database schema is written by
# auto-setup at first boot and is version-specific; pointing a new server at an
# old schema fails in confusing ways. Always use --clean when switching.
#
name: temporal-obs-demo

services:
  # ---------------------------------------------------------------------------
  # Persistence
  # ---------------------------------------------------------------------------
  postgresql:
    image: postgres:${POSTGRES_VERSION:-16-alpine}
    container_name: tobs-postgres
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [tobs]

  # ---------------------------------------------------------------------------
  # Temporal Service
  #
  # auto-setup runs frontend, history, matching, and worker roles in ONE
  # container. That means a single metrics endpoint on :8000 carries all four,
  # distinguished by the service_name label. A real deployment runs them as
  # separate processes with separate scrape targets — the dashboard queries are
  # identical either way, but prometheus.yml would list four targets.
  # ---------------------------------------------------------------------------
  temporal:
    image: temporalio/auto-setup:${TEMPORAL_VERSION:-1.27.4}
    container_name: tobs-temporal
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: postgresql
      # Exposes the Prometheus scrape endpoint on :8000. Without this the
      # entire "Service Health" and "Persistence" half of the dashboard is dark.
      PROMETHEUS_ENDPOINT: 0.0.0.0:8000
    ports:
      - "7233:7233"   # gRPC — Frontend Service (also the health check port)
      - "8000:8000"   # Prometheus metrics
    healthcheck:
      # NOT 127.0.0.1. auto-setup binds the Frontend to the container's own
      # eth0 address (BIND_ON_IP defaults to that, not to 0.0.0.0), so nothing
      # is listening on loopback and a health check against 127.0.0.1:7233 gets
      # connection-refused forever. The container then never goes healthy and
      # every service gated on `condition: service_healthy` — api, worker,
      # temporal-ui — silently never starts.
      test: ["CMD-SHELL", "temporal operator cluster health --address $$(hostname -i):7233"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    networks: [tobs]

  temporal-ui:
    image: temporalio/ui:${TEMPORAL_UI_VERSION:-2.53.3}
    container_name: tobs-temporal-ui
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"
    networks: [tobs]

  # ---------------------------------------------------------------------------
  # Demo application
  # ---------------------------------------------------------------------------
  api:
    build: ./app
    container_name: tobs-api
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      MODE: api
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
      TASK_QUEUE: orders
      HTTP_PORT: "8081"
      METRICS_PORT: "8077"
    ports:
      - "8081:8081"
    networks: [tobs]

  worker:
    build: ./app
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      MODE: worker
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
      TASK_QUEUE: orders
      METRICS_PORT: "8077"
      # Deliberately low so slot exhaustion is reachable on a laptop.
      # Temporal's real default is 1000 for both. Raise these to show the
      # difference between "not enough Workers" and "Workers configured too small".
      MAX_CONCURRENT_ACTIVITIES: "10"
      MAX_CONCURRENT_WORKFLOW_TASKS: "10"
      # Set by `make chaos-nde`. Injects a command absent from open Workflows'
      # histories so replay diverges. Empty in normal operation.
      #
      # Passed through the WORKER SERVICE rather than a `docker compose run`
      # container on purpose: Prometheus finds Workers by dns_sd on the `worker`
      # service name, and a run container does not get that DNS record — so the
      # NDE metric never reached Prometheus and the alert could not fire. Same
      # failure the metric itself teaches: the signal existed, nothing collected it.
      NDE_INJECT: "${NDE_INJECT:-}"
    # No published ports — this service gets scaled up and down during chaos
    # runs, and host port bindings would collide. Prometheus finds every
    # replica through Compose DNS instead (see prometheus.yml).
    networks: [tobs]

  # ---------------------------------------------------------------------------
  # Observability
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION:-v3.1.0}
    container_name: tobs-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      # 15d, not the 6h this used to be. Error budgets are a question about a
      # compliance window, and you cannot answer a 7-day question with 6 hours
      # of data — the budget silently resets to pristine every time the
      # retention window rolls past the incident that spent it.
      #
      # Still not production storage: there is no remote write and no volume
      # mount, so `make down` erases every error budget. A real SLO stack needs
      # durable, long-retention storage; a laptop demo with an amnesiac budget
      # is the most common way SLO dashboards end up lying about attainment.
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prom-data:/prometheus
    ports:
      - "9090:9090"
    networks: [tobs]

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-11.5.1}
    container_name: tobs-grafana
    depends_on: [prometheus]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    networks: [tobs]

  # ---------------------------------------------------------------------------
  # Load / chaos driver. Not started by default.
  #   docker compose run --rm k6 run /scripts/01-backlog-storm.js
  # ---------------------------------------------------------------------------
  k6:
    image: grafana/k6:${K6_VERSION:-0.55.0}
    profiles: [tools]
    volumes:
      - ./k6:/scripts:ro
    environment:
      API_BASE: http://api:8081
    networks: [tobs]

  # ---------------------------------------------------------------------------
  # Logs
  #
  # Why logs belong in this stack rather than being someone else's problem:
  # every metric and alert here REFUSES a workflow_id label, because that is an
  # unbounded dimension and Temporal omits it from SDK metrics for the same
  # reason. So metrics can tell you three workflows are stuck; they can never
  # tell you WHICH.
  #
  # On any server below 1.30 there is no TemporalReportedProblems search
  # attribute either, so worker logs are the only route from "something is
  # stuck" to an execution ID. That makes Loki a dependency of the
  # stuck-workflow runbook, not a nice-to-have.
  # ---------------------------------------------------------------------------
  loki:
    image: grafana/loki:${LOKI_VERSION:-3.3.2}
    container_name: tobs-loki
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready | grep -q ready"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks: [tobs]

  # Alloy, not Promtail: Promtail is deprecated, Alloy is the supported
  # collector. Reads container logs from the Docker socket.
  #
  # The socket mount is COMPOSE-SPECIFIC. On Kubernetes this becomes an Alloy
  # DaemonSet reading pod logs — same Loki, different discovery.
  alloy:
    image: grafana/alloy:${ALLOY_VERSION:-v1.5.1}
    container_name: tobs-alloy
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      # Read-only socket: Alloy only needs to LIST containers and read logs.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      loki:
        condition: service_healthy
    ports:
      - "12345:12345"
    networks: [tobs]

  # ---------------------------------------------------------------------------
  # Workflow SLO monitor
  #
  # Answers the one question Prometheus structurally cannot: is an OPEN execution
  # past its duration budget? Every Temporal workflow-outcome metric is a counter
  # over executions that ENDED, so a Workflow stuck forever increments nothing.
  # Prove the gap with `make chaos-stuck`, then watch this service's
  # over_budget_executions climb while every alert stays silent.
  # ---------------------------------------------------------------------------
  slo-monitor:
    build: ../monitor
    container_name: tobs-slo-monitor
    depends_on:
      temporal:
        condition: service_healthy
    command:
      - -config=/etc/monitor/slo-config.yaml
      - -listen=:9111
    volumes:
      - ../monitor/slo-config.demo.yaml:/etc/monitor/slo-config.yaml:ro
    ports:
      - "9111:9111"
    networks: [tobs]

# Error budgets are cumulative over a 28-day window, so they only mean something
# if they survive a restart. Without these, `make down` erased every budget and
# the SLO board silently started from pristine each session — the most common way
# an SLO dashboard ends up lying about attainment.
#
# `make down` no longer removes them. Use `make reset` (or ./deploy.sh --clean)
# when you actually want a blank slate.
volumes:
  prom-data:
  loki-data:

networks:
  tobs:
    driver: bridge
