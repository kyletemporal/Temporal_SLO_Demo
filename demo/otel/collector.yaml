# OpenTelemetry Collector — receive, NORMALISE, redact, fan out.
#
# Workers could export straight to Tempo, so why run this? Because sampling,
# redaction and attribute naming are decisions that belong OUTSIDE application
# code. Changing any of them here does not require a Worker redeploy, and the
# rules apply identically to Go, Java, TypeScript, Python and .NET Workers.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Bound memory so the collector cannot become the thing that takes the host
  # down. Under pressure it sheds telemetry, which is the correct trade.
  memory_limiter:
    check_interval: 1s
    limit_percentage: 75
    spike_limit_percentage: 20

  # ---------------------------------------------------------------------------
  # ATTRIBUTE NORMALISATION — this is what makes correlation automatic.
  #
  # The Temporal SDK tracing interceptor emits camelCase, non-OTel-convention
  # attribute names. Verified by reading real spans out of Tempo, not assumed:
  #
  #     temporalWorkflowID   = order-tr2-1
  #     temporalRunID        = 01a010b2-c250-72ea-b84b-b99782438077
  #     temporalActivityID   = 5
  #
  # Two problems with consuming those directly. They do not match OTel semantic
  # conventions, so no downstream tool knows what they mean; and they are an SDK
  # implementation detail that can change under you.
  #
  # This copies them to dotted, conventional keys and KEEPS the originals, so
  # dashboards written against either form keep working. Do the rename here and
  # every SDK gets it for free.
  # ---------------------------------------------------------------------------
  transform/temporal_attributes:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - set(attributes["temporal.workflow.id"], attributes["temporalWorkflowID"]) where attributes["temporalWorkflowID"] != nil
          - set(attributes["temporal.run.id"], attributes["temporalRunID"]) where attributes["temporalRunID"] != nil
          - set(attributes["temporal.activity.id"], attributes["temporalActivityID"]) where attributes["temporalActivityID"] != nil

          # Span names carry the shape "RunActivity:ChargePayment". Splitting the
          # kind out makes it filterable, which is the difference between
          # "show me slow spans" and "show me slow ACTIVITIES".
          - set(attributes["temporal.span.kind"], "workflow") where IsMatch(name, "^(Start|Run)Workflow:")
          - set(attributes["temporal.span.kind"], "activity") where IsMatch(name, "^(Start|Run)Activity:")
          - set(attributes["temporal.span.phase"], "start") where IsMatch(name, "^Start")
          - set(attributes["temporal.span.phase"], "run") where IsMatch(name, "^Run")

  # Environment and ownership, applied centrally so no Worker has to remember.
  # deployment.environment is what stops a staging trace being read as production
  # during an incident.
  resource/environment:
    attributes:
      - key: deployment.environment
        value: ${env:DEPLOY_ENV}
        action: upsert
      - key: service.namespace
        value: ${env:TEMPORAL_NAMESPACE}
        action: upsert

  # Temporal payloads can carry customer data, and a span attribute is an easy
  # way for it to leak into a system with weaker access controls than the
  # Workflow history it came from. Redact at the boundary, not in every app.
  attributes/redact:
    actions:
      - key: temporalPayloads
        action: delete
      - key: temporalWorkflowInput
        action: delete
      - key: temporalWorkflowResult
        action: delete

  batch:
    timeout: 5s
    send_batch_size: 512

  # ---------------------------------------------------------------------------
  # GENAI METRIC HYGIENE
  #
  # The agent Workers emit gen_ai.* metrics (see demo/app/agent_telemetry.go).
  # Two things have to be true before those reach Prometheus, and neither is the
  # application's job:
  #
  #  1. NO PROMPT OR COMPLETION TEXT ON A METRIC. The GenAI conventions define
  #     optional attributes carrying prompt and response content. On a SPAN that
  #     is a defensible trade; on a METRIC it is unbounded cardinality made of
  #     customer data — every distinct prompt becomes a permanent time series.
  #     Dropping them here means no SDK, no auto-instrumentation and no future
  #     Worker can leak them by default.
  #
  #  2. MODEL NAMES MUST NOT BE FREE TEXT. A caller passing a dated snapshot
  #     ("claude-opus-5-20260101") creates a series that never joins the one for
  #     "claude-opus-5", so a cost panel silently splits in two the day someone
  #     pins a version. Normalising centrally is the same argument the span
  #     transform above already makes.
  # ---------------------------------------------------------------------------
  attributes/genai_redact:
    actions:
      - key: gen_ai.prompt
        action: delete
      - key: gen_ai.completion
        action: delete
      - key: gen_ai.input.messages
        action: delete
      - key: gen_ai.output.messages
        action: delete
      - key: gen_ai.system_instructions
        action: delete

  transform/genai_model_normalise:
    error_mode: ignore
    metric_statements:
      - context: datapoint
        statements:
          # Strip a trailing -YYYYMMDD snapshot suffix so pinned and floating
          # model IDs aggregate together.
          - replace_pattern(attributes["gen_ai.request.model"], "-[0-9]{8}$", "")
          - replace_pattern(attributes["gen_ai.response.model"], "-[0-9]{8}$", "")

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  # Prometheus SCRAPE endpoint rather than remote-write.
  #
  # Remote-write would have been fewer moving parts, but it makes the collector
  # push into Prometheus, and a push pipeline has no "target down" signal: if the
  # collector dies, the series simply stop and the panel shows a flat line that
  # looks like zero traffic. With a scrape target, Prometheus reports `up == 0`
  # and the difference between "no agents ran" and "we lost the collector"
  # remains visible. That distinction is the entire subject of this repo.
  prometheus:
    endpoint: 0.0.0.0:8889
    # The metric names already carry their namespace (gen_ai_*), so an added
    # prefix would only make every query longer.
    namespace: ""
    # Resource attributes (service.name, deployment.environment) become labels
    # rather than being dropped. Without this, two agent Workers in different
    # environments are indistinguishable in Prometheus even though the OTLP
    # payload could tell them apart.
    resource_to_telemetry_conversion:
      enabled: true
    # Keep series alive across scrape gaps. An agent fleet is bursty by nature —
    # without this a counter that stops incrementing disappears entirely, and
    # increase() over the window that contains the gap under-reports.
    metric_expiration: 10m

service:
  telemetry:
    logs:
      level: warn
  pipelines:
    traces:
      receivers: [otlp]
      processors:
        - memory_limiter
        - transform/temporal_attributes
        - resource/environment
        - attributes/redact
        - attributes/genai_redact
        - batch
      exporters: [otlp/tempo]

    # Metrics pipeline — gen_ai.* only, in practice.
    #
    # This does NOT carry Temporal SDK metrics and must not start doing so.
    # Those come from Tally and are scraped directly off each process on :8077;
    # routing them through here as well would produce a SECOND copy of every
    # Temporal series under different names (the OTel exporter drops the
    # _seconds suffix the dashboards depend on), and the two would disagree.
    # tracing.go makes the same argument at length for traces.
    metrics:
      receivers: [otlp]
      processors:
        - memory_limiter
        - resource/environment
        - attributes/genai_redact
        - transform/genai_model_normalise
        - batch
      exporters: [prometheus]
