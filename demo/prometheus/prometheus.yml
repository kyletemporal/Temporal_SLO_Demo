global:
  scrape_interval: 10s
  evaluation_interval: 10s
  external_labels:
    cluster: demo

rule_files:
  - /etc/prometheus/alerts.yml
  - /etc/prometheus/monitor-rules.yml
  # SLI recording rules, error budgets, and burn-rate alerts. Kept separate
  # from alerts.yml because the two answer different questions: alerts.yml is
  # "is something broken right now", slo-rules.yml is "are we still meeting
  # what we promised, and how much room is left".
  - /etc/prometheus/slo-rules.yml
  # GenAI agent recording rules and alerts. Separate file because the questions
  # are different in kind: everything else here asks whether the platform is
  # healthy, this asks whether the agents are behaving and what they cost.
  - /etc/prometheus/agent-rules.yml

scrape_configs:
  # ---------------------------------------------------------------------------
  # Temporal Service (cluster) metrics
  #
  # auto-setup bundles frontend, history, matching, and worker roles into one
  # process, so this single target carries all four. The service_name label
  # separates them, which is why every cluster query in the dashboard filters
  # on service_name rather than on job.
  #
  # In a real deployment, replace this with one target per role.
  # ---------------------------------------------------------------------------
  - job_name: temporal-service
    metrics_path: /metrics
    static_configs:
      - targets: ["temporal:8000"]
        labels:
          group: server-metrics

  # ---------------------------------------------------------------------------
  # Temporal SDK metrics — API process
  # ---------------------------------------------------------------------------
  - job_name: temporal-sdk-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8077"]
        labels:
          group: sdk-metrics
          role: api

  # ---------------------------------------------------------------------------
  # Temporal SDK metrics — Worker fleet
  #
  # dns_sd rather than a static target because the worker service gets scaled
  # during chaos runs (`docker compose up -d --scale worker=5`). Compose's
  # embedded DNS returns an A record per replica, so Prometheus picks up new
  # Workers automatically and drops them when they are scaled away.
  #
  # A static target would pin to whichever replica DNS resolved first and
  # silently under-report the fleet — which is exactly the kind of gap that
  # makes a dashboard lie during an incident.
  # ---------------------------------------------------------------------------
  - job_name: temporal-sdk-worker
    metrics_path: /metrics
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 8077
        refresh_interval: 10s
    relabel_configs:
      - target_label: group
        replacement: sdk-metrics
      - target_label: role
        replacement: worker

  # ---------------------------------------------------------------------------
  # Temporal SDK metrics — agent Worker fleet
  #
  # Same dns_sd pattern as the order Workers, separate job so the two fleets can
  # be compared side by side. `role` is what the scale dashboard splits on:
  # agent Workers and order Workers have completely different healthy slot
  # utilisation, and a single blended figure would hide both.
  # ---------------------------------------------------------------------------
  - job_name: temporal-sdk-agent-worker
    metrics_path: /metrics
    dns_sd_configs:
      - names: ["agent-worker"]
        type: A
        port: 8077
        refresh_interval: 10s
    relabel_configs:
      - target_label: group
        replacement: sdk-metrics
      - target_label: role
        replacement: agent-worker

  # ---------------------------------------------------------------------------
  # GenAI agent metrics, via the OTel Collector
  #
  # These are the gen_ai_* series emitted by the agent Workers — Go and Python,
  # Anthropic / OpenAI / LangChain / mock. They arrive OTLP at the collector and
  # are re-exposed here for scraping.
  #
  # A worker therefore appears as TWO scrape targets: temporal-sdk-worker for
  # its Tally-based Temporal series, and this job for its OTel-based agent
  # series. That looks redundant and is not — see the note at the top of
  # demo/app/agent_telemetry.go. The short version: the two exporters emit
  # DIFFERENT NAMES for the same Temporal metrics, so consolidating on OTel
  # would rename every series the existing rules and dashboards are built on.
  #
  # Consequence worth knowing before debugging: `up` for THIS job says whether
  # the collector is reachable, not whether any agent is running. An agent
  # Worker that has crashed leaves this target up and its series flat. The
  # temporal-sdk-worker job is what tells you a Worker went away.
  # ---------------------------------------------------------------------------
  - job_name: otel-collector-genai
    metrics_path: /metrics
    static_configs:
      - targets: ["otel-collector:8889"]
        labels:
          group: genai-metrics
    # Trim labels that resource_to_telemetry_conversion adds to EVERY series.
    #
    # Measured on a single agent run: telemetry_sdk_name, telemetry_sdk_version,
    # telemetry_sdk_language and service_version appeared on all 14 gen_ai
    # series and none of them varies — four constant labels per series, paid for
    # on every sample, forever.
    #
    # exported_job goes too. It is Prometheus's rename of the collector's own
    # `job` label after it collided with this scrape job's; it duplicates
    # service_name and only ever confuses whoever is reading the label set.
    #
    # service_name, deployment_environment and temporal_task_queue are KEPT —
    # those genuinely vary and every panel splits on them.
    metric_relabel_configs:
      - regex: "telemetry_sdk_name|telemetry_sdk_version|telemetry_sdk_language|service_version|exported_job"
        action: labeldrop

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # The Workflow SLO monitor. Its series are temporal_slo_* and are the only
  # duration-based view of OPEN executions in this stack.
  - job_name: slo-monitor
    static_configs:
      - targets: ['slo-monitor:9111']
