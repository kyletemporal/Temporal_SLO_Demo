# =============================================================================
# Temporal SLOs, error budgets and burn-rate alerts — PRODUCTION
# =============================================================================
#
# Compliance window: 28d.  Multi-tenant: tenant SLIs are per-namespace.
#
# ---------------------------------------------------------------------------
# Architecture: rates first, ratios second
# ---------------------------------------------------------------------------
# Layer 1 records the NUMERATOR and DENOMINATOR as 5m event rates, not the
# ratio. Every longer window is then derived with avg_over_time() over those
# two recordings.
#
# This matters at production scale. Computing rate(...[28d]) directly over raw
# counters makes Prometheus read 28 days of samples on every evaluation, for
# every SLI, every 30 seconds — the single most common way an SLO rule set
# takes down the monitoring system it was meant to protect. avg_over_time over
# a 5m recording reads pre-aggregated points instead.
#
# It is also arithmetically correct rather than approximate: because
# avg(rate) == total_events / window, dividing avg_bad by avg_total yields the
# traffic-WEIGHTED ratio. Averaging the per-5m ratios instead would weight a
# quiet Sunday equally with a Monday peak, which is the standard subtle bug in
# hand-rolled SLO rules.
#
#   slo:events_bad:rate5m       bad events/sec        (layer 1, per SLI)
#   slo:events_total:rate5m     total events/sec      (layer 1, per SLI)
#   slo:sli_bad:ratio_rate<W>   bad ratio over W      (layer 2, generic)
#   slo:objective:ratio         the promise           (layer 2)
#   slo:error_budget:ratio      1 - objective         (layer 2)
#   slo:burn_rate:ratio_rate<W> ratio / budget        (layer 2, generic)
#   slo:error_budget_remaining:ratio                  (layer 2)
#
# Layers 2 and 3 are written ONCE and apply to every SLI by matching on the
# `sli` label. Adding an SLI means adding two layer-1 rules; budgets, burn
# rates and alerts pick it up automatically.
#
# ---------------------------------------------------------------------------
# Before you deploy this
# ---------------------------------------------------------------------------
# 1. OBJECTIVES BELOW ARE PLACEHOLDERS. 99.9% and 99% are round numbers, not
#    measurements. Run these rules in recording-only mode for two weeks, look
#    at what your cluster actually delivers, then set objectives you can meet.
#    An SLO you miss at baseline trains everyone to ignore the board.
# 2. Prometheus needs retention >= 28d AND durable storage. An error budget
#    that resets when the monitoring stack restarts will report perfect
#    attainment through an outage it has forgotten.
# 3. Re-derive the long-poll operation list on YOUR server version.
# 4. If your Workers are serverless/ephemeral, task_delivery and every
#    absence-based alert need rethinking — see docs/SERVERLESS-WORKERS.md.
# =============================================================================

groups:
  # ==========================================================================
  # LAYER 1 — event rates. Two rules per SLI. The only per-SLI code.
  # ==========================================================================
  - name: temporal-slo-events
    interval: 30s
    rules:

      # --- frontend_availability [tenant]: Frontend gRPC requests that did not fault, per namespace
      - record: slo:events_bad:rate5m
        expr: |
          (
            sum by (namespace) (rate(service_error_with_type{service_name="frontend", error_type!~"serviceerror_(Canceled|NotFound|NamespaceNotFound|AlreadyExist.*|InvalidArgument|FailedPrecondition|WorkflowExecutionAlreadyStarted|QueryFailed)", namespace!~"temporal_system|system|_unknown_"}[5m]))
            or
            sum by (namespace) (rate(service_requests{service_name="frontend", namespace!~"temporal_system|system|_unknown_"}[5m])) * 0
          )
        labels:
          sli: frontend_availability
          tier: tenant
      - record: slo:events_total:rate5m
        expr: |
          sum by (namespace) (rate(service_requests{service_name="frontend", namespace!~"temporal_system|system|_unknown_"}[5m]))
        labels:
          sli: frontend_availability
          tier: tenant

      # --- frontend_latency [tenant]: Frontend requests served under 0.5s (long-polls excluded)
      - record: slo:events_bad:rate5m
        expr: |
          clamp_min(
            sum by (namespace) (rate(service_latency_count{service_name="frontend", operation!~"Poll.*|GetTaskQueueUserData|ListNexusEndpoints", namespace!~"temporal_system|system|_unknown_"}[5m]))
            -
            sum by (namespace) (rate(service_latency_bucket{service_name="frontend", operation!~"Poll.*|GetTaskQueueUserData|ListNexusEndpoints", le="0.5", namespace!~"temporal_system|system|_unknown_"}[5m])),
            0
          )
        labels:
          sli: frontend_latency
          tier: tenant
      - record: slo:events_total:rate5m
        expr: |
          sum by (namespace) (rate(service_latency_count{service_name="frontend", operation!~"Poll.*|GetTaskQueueUserData|ListNexusEndpoints", namespace!~"temporal_system|system|_unknown_"}[5m]))
        labels:
          sli: frontend_latency
          tier: tenant

      # --- workflow_completion [tenant]: Workflows reaching successful completion; timeouts count as bad
      - record: slo:events_bad:rate5m
        expr: |
          (
            (sum by (namespace) (rate(workflow_failed{namespace!~"temporal_system|system|_unknown_"}[5m]))  or sum by (namespace) (rate(workflow_success{namespace!~"temporal_system|system|_unknown_"}[5m])) * 0)
            +
            (sum by (namespace) (rate(workflow_timeout{namespace!~"temporal_system|system|_unknown_"}[5m])) or sum by (namespace) (rate(workflow_success{namespace!~"temporal_system|system|_unknown_"}[5m])) * 0)
          )
        labels:
          sli: workflow_completion
          tier: tenant
      - record: slo:events_total:rate5m
        expr: |
          (
            sum by (namespace) (rate(workflow_success{namespace!~"temporal_system|system|_unknown_"}[5m]))
            +
            (sum by (namespace) (rate(workflow_failed{namespace!~"temporal_system|system|_unknown_"}[5m]))  or sum by (namespace) (rate(workflow_success{namespace!~"temporal_system|system|_unknown_"}[5m])) * 0)
            +
            (sum by (namespace) (rate(workflow_timeout{namespace!~"temporal_system|system|_unknown_"}[5m])) or sum by (namespace) (rate(workflow_success{namespace!~"temporal_system|system|_unknown_"}[5m])) * 0)
          )
        labels:
          sli: workflow_completion
          tier: tenant

      # --- task_delivery [tenant]: Activity Tasks started within 0.2s of scheduling
      - record: slo:events_bad:rate5m
        expr: |
          clamp_min(
            sum by (namespace) (rate(temporal_activity_schedule_to_start_latency_seconds_count{namespace!~"temporal_system|system|_unknown_"}[5m]))
            -
            sum by (namespace) (rate(temporal_activity_schedule_to_start_latency_seconds_bucket{le="0.2", namespace!~"temporal_system|system|_unknown_"}[5m])),
            0
          )
        labels:
          sli: task_delivery
          tier: tenant
      - record: slo:events_total:rate5m
        expr: |
          sum by (namespace) (rate(temporal_activity_schedule_to_start_latency_seconds_count{namespace!~"temporal_system|system|_unknown_"}[5m]))
        labels:
          sli: task_delivery
          tier: tenant

      # --- history_availability [infra]: History service requests that did not fault (cluster-wide)
      - record: slo:events_bad:rate5m
        expr: |
          (
            sum (rate(service_error_with_type{service_name="history", error_type!~"serviceerror_(Canceled|NotFound|NamespaceNotFound|AlreadyExist.*|InvalidArgument|FailedPrecondition|WorkflowExecutionAlreadyStarted|QueryFailed)"}[5m]))
            or
            sum (rate(service_requests{service_name="history"}[5m])) * 0
          )
        labels:
          sli: history_availability
          tier: infra
      - record: slo:events_total:rate5m
        expr: |
          sum (rate(service_requests{service_name="history"}[5m]))
        labels:
          sli: history_availability
          tier: infra

      # --- matching_availability [infra]: Matching service requests that did not fault (cluster-wide)
      - record: slo:events_bad:rate5m
        expr: |
          (
            sum (rate(service_error_with_type{service_name="matching", error_type!~"serviceerror_(Canceled|NotFound|NamespaceNotFound|AlreadyExist.*|InvalidArgument|FailedPrecondition|WorkflowExecutionAlreadyStarted|QueryFailed)"}[5m]))
            or
            sum (rate(service_requests{service_name="matching"}[5m])) * 0
          )
        labels:
          sli: matching_availability
          tier: infra
      - record: slo:events_total:rate5m
        expr: |
          sum (rate(service_requests{service_name="matching"}[5m]))
        labels:
          sli: matching_availability
          tier: infra

      # --- persistence_availability [infra]: Datastore operations that did not fault, per service role
      - record: slo:events_bad:rate5m
        expr: |
          (
            sum by (service_name) (rate(persistence_error_with_type{error_type!~"serviceerror_(Canceled|NotFound|NamespaceNotFound|AlreadyExist.*|InvalidArgument|FailedPrecondition|WorkflowExecutionAlreadyStarted|QueryFailed)"}[5m]))
            or
            sum by (service_name) (rate(persistence_requests[5m])) * 0
          )
        labels:
          sli: persistence_availability
          tier: infra
      - record: slo:events_total:rate5m
        expr: |
          sum by (service_name) (rate(persistence_requests[5m]))
        labels:
          sli: persistence_availability
          tier: infra

  # ==========================================================================
  # LAYER 2 — ratios, objectives, budgets, burn rates. Generic.
  # ==========================================================================
  - name: temporal-slo-meta
    interval: 30s
    rules:

      # Bad-event ratio per window. avg_over_time over the 5m recordings,
      # NOT rate() over raw counters — see the header for why.
      - record: slo:sli_bad:ratio_rate5m
        expr: |
          slo:events_bad:rate5m
          /
          slo:events_total:rate5m
      - record: slo:sli_bad:ratio_rate30m
        expr: |
          avg_over_time(slo:events_bad:rate5m[30m])
          /
          avg_over_time(slo:events_total:rate5m[30m])
      - record: slo:sli_bad:ratio_rate1h
        expr: |
          avg_over_time(slo:events_bad:rate5m[1h])
          /
          avg_over_time(slo:events_total:rate5m[1h])
      - record: slo:sli_bad:ratio_rate2h
        expr: |
          avg_over_time(slo:events_bad:rate5m[2h])
          /
          avg_over_time(slo:events_total:rate5m[2h])
      - record: slo:sli_bad:ratio_rate6h
        expr: |
          avg_over_time(slo:events_bad:rate5m[6h])
          /
          avg_over_time(slo:events_total:rate5m[6h])
      - record: slo:sli_bad:ratio_rate1d
        expr: |
          avg_over_time(slo:events_bad:rate5m[1d])
          /
          avg_over_time(slo:events_total:rate5m[1d])
      - record: slo:sli_bad:ratio_rate3d
        expr: |
          avg_over_time(slo:events_bad:rate5m[3d])
          /
          avg_over_time(slo:events_total:rate5m[3d])
      - record: slo:sli_bad:ratio_rate28d
        expr: |
          avg_over_time(slo:events_bad:rate5m[28d])
          /
          avg_over_time(slo:events_total:rate5m[28d])

      # Objectives. PLACEHOLDERS — derive from your own baseline.
      - record: slo:objective:ratio
        expr: vector(0.999)
        labels:
          sli: frontend_availability
      - record: slo:objective:ratio
        expr: vector(0.99)
        labels:
          sli: frontend_latency
      - record: slo:objective:ratio
        expr: vector(0.99)
        labels:
          sli: workflow_completion
      - record: slo:objective:ratio
        expr: vector(0.99)
        labels:
          sli: task_delivery
      - record: slo:objective:ratio
        expr: vector(0.999)
        labels:
          sli: history_availability
      - record: slo:objective:ratio
        expr: vector(0.999)
        labels:
          sli: matching_availability
      - record: slo:objective:ratio
        expr: vector(0.999)
        labels:
          sli: persistence_availability

      - record: slo:error_budget:ratio
        expr: 1 - slo:objective:ratio

      # The compliance window, in one place. Repoint to change it.
      - record: slo:compliance_window_bad:ratio
        expr: slo:sli_bad:ratio_rate28d

      # Burn rate: multiples of sustainable spend. 1.0 exhausts the budget
      # exactly at the end of the window. group_left() because SLIs carry
      # namespace/service_name labels the objective series does not.
      - record: slo:burn_rate:ratio_rate5m
        expr: |
          slo:sli_bad:ratio_rate5m
            / on(sli) group_left() slo:error_budget:ratio
      - record: slo:burn_rate:ratio_rate30m
        expr: |
          slo:sli_bad:ratio_rate30m
            / on(sli) group_left() slo:error_budget:ratio
      - record: slo:burn_rate:ratio_rate1h
        expr: |
          slo:sli_bad:ratio_rate1h
            / on(sli) group_left() slo:error_budget:ratio
      - record: slo:burn_rate:ratio_rate2h
        expr: |
          slo:sli_bad:ratio_rate2h
            / on(sli) group_left() slo:error_budget:ratio
      - record: slo:burn_rate:ratio_rate6h
        expr: |
          slo:sli_bad:ratio_rate6h
            / on(sli) group_left() slo:error_budget:ratio
      - record: slo:burn_rate:ratio_rate1d
        expr: |
          slo:sli_bad:ratio_rate1d
            / on(sli) group_left() slo:error_budget:ratio
      - record: slo:burn_rate:ratio_rate3d
        expr: |
          slo:sli_bad:ratio_rate3d
            / on(sli) group_left() slo:error_budget:ratio

      - record: slo:error_budget_remaining:ratio
        expr: |
          1 - (
            slo:compliance_window_bad:ratio
              / on(sli) group_left() slo:error_budget:ratio
          )

      - record: slo:sli_good:ratio
        expr: 1 - slo:compliance_window_bad:ratio

      # Objective broadcast onto each SLI's full label set, so a dashboard
      # table can join it against the others without splitting rows.
      - record: slo:objective_expanded:ratio
        expr: |
          slo:compliance_window_bad:ratio * 0
            + on(sli) group_left() slo:objective:ratio

  # ==========================================================================
  # LAYER 3 — multi-window multi-burn-rate alerts (Google SRE workbook)
  #
  # Two windows per alert, both breaching. The long window proves the burn is
  # real; the short window proves it is STILL happening, so the alert clears
  # promptly instead of lingering for the length of the long window.
  #
  # Against a 28d budget:
  #   14.4x over 1h  -> 2% of the budget gone.   Page.
  #   6x    over 6h  -> 5% gone.                 Page.
  #   3x    over 1d  -> 10% gone.                Ticket.
  #   1x    over 3d  -> 10% gone, slowly.        Ticket.
  #
  # Route `severity: page` to your pager and `severity: ticket` to a queue.
  # If you route tickets to the pager you have rebuilt threshold alerting.
  # ==========================================================================
  - name: temporal-slo-burn
    rules:
      - alert: SLOFastBurn
        expr: |
          (slo:burn_rate:ratio_rate1h > 14.4) and (slo:burn_rate:ratio_rate5m > 14.4)
        for: 2m
        labels:
          severity: page
          component: temporal-slo
        annotations:
          summary: "{{ $labels.sli }} burning error budget 14.4x (ns={{ $labels.namespace }})"
          description: "At this rate the entire 28d budget is gone in about two hours. Sustained over 1h and still active in the last 5m."

      - alert: SLOSlowBurn
        expr: |
          (slo:burn_rate:ratio_rate6h > 6) and (slo:burn_rate:ratio_rate30m > 6)
        for: 15m
        labels:
          severity: page
          component: temporal-slo
        annotations:
          summary: "{{ $labels.sli }} burning error budget 6x (ns={{ $labels.namespace }})"
          description: "Slower, still fast enough to exhaust the budget well before the window ends."

      - alert: SLOBudgetBurnTicket
        expr: |
          (slo:burn_rate:ratio_rate1d > 3) and (slo:burn_rate:ratio_rate2h > 3)
        for: 1h
        labels:
          severity: ticket
          component: temporal-slo
        annotations:
          summary: "{{ $labels.sli }} burning error budget 3x (ns={{ $labels.namespace }})"
          description: "Not an emergency. Worth a ticket before it becomes one."

      - alert: SLOBudgetBurnSlowTicket
        expr: |
          (slo:burn_rate:ratio_rate3d > 1) and (slo:burn_rate:ratio_rate6h > 1)
        for: 3h
        labels:
          severity: ticket
          component: temporal-slo
        annotations:
          summary: "{{ $labels.sli }} spending budget faster than sustainable (ns={{ $labels.namespace }})"
          description: "Above 1x means you will not make the window if this continues. Chronic, not acute."

      - alert: SLOErrorBudgetExhausted
        expr: slo:error_budget_remaining:ratio <= 0
        for: 10m
        labels:
          severity: ticket
          component: temporal-slo
        annotations:
          summary: "{{ $labels.sli }} has exhausted its 28d error budget (ns={{ $labels.namespace }})"
          description: "The SLO has been missed across the compliance window. Under a standard error budget policy this freezes risky change for this component until the budget recovers."
