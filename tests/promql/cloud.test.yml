# promtool unit tests for cloud/prometheus. Run: tests/promql/run.sh
#
# Cloud metrics are pre-computed per-second gauges, so input values are flat
# rates ('10x40'), not counters. Label sets follow Temporal's OpenMetrics
# reference. The mismatches between them (operation, timeout_type,
# task_type) are what made several of these return EMPTY before.
rule_files:
  - ../../cloud/prometheus/slo-rules.yml
  - ../../cloud/prometheus/alerts.yml

evaluation_interval: 1m

tests:
  # 1. Total outage: no workflow_success series at all.
  - interval: 1m
    input_series:
      - series: 'temporal_cloud_v1_workflow_failed_count{temporal_namespace="ns.acct",temporal_account="acct",region="aws-us-east-1",temporal_workflow_type="Order",temporal_task_queue="orders"}'
        values: '5x40'
      - series: 'temporal_cloud_v1_workflow_timeout_count{temporal_namespace="ns.acct",temporal_account="acct",region="aws-us-east-1",temporal_workflow_type="Order",temporal_task_queue="orders"}'
        values: '5x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: TemporalCloudWorkflowFailureRatioHigh
        exp_alerts:
          - exp_labels: {temporal_namespace: ns.acct, temporal_workflow_type: Order, severity: page, component: temporal-application}
            exp_annotations:
              summary: "Over 5% of Order Workflows failing or timing out in ns.acct"
              description: "Your application, not Temporal. Check retry policies and whether Workflows handle their failure paths. A spike in timeouts specifically usually means Worker saturation rather than bugs."
    promql_expr_test:
      - expr: cloudslo:sli_bad:ratio_rate5m{sli="workflow_completion"}
        eval_time: 30m
        exp_samples:
          - labels: 'cloudslo:sli_bad:ratio_rate5m{sli="workflow_completion",temporal_namespace="ns.acct"}'
            value: 1

  # 2. Request usage at 95% of the limit, split across two operations. The
  #    limit gauge has no `operation` label; the old one-to-one division
  #    matched nothing.
  - interval: 1m
    input_series:
      - series: 'temporal_cloud_v1_service_request_count{temporal_namespace="ns.acct",temporal_account="acct",region="aws-us-east-1",operation="StartWorkflowExecution"}'
        values: '50x40'
      - series: 'temporal_cloud_v1_service_request_count{temporal_namespace="ns.acct",temporal_account="acct",region="aws-us-east-1",operation="PollWorkflowTaskQueue"}'
        values: '45x40'
      - series: 'temporal_cloud_v1_service_request_limit{temporal_namespace="ns.acct",temporal_account="acct",region="aws-us-east-1"}'
        values: '100x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: TemporalCloudRequestsNearLimit
        exp_alerts:
          - exp_labels: {temporal_namespace: ns.acct, severity: ticket, component: temporal-cloud-limits}
            exp_annotations:
              summary: "Request rate above 80% of limit in ns.acct"

  # 3. task_delivery resolves: 1 no-poller Task per 3 matched. It used to add
  #    Workflow completions to Tasks and was always empty.
  - interval: 1m
    input_series:
      - series: 'temporal_cloud_v1_no_poller_tasks_count{temporal_namespace="ns.acct",temporal_account="acct",region="aws-us-east-1",temporal_task_queue="orders",task_type="activity"}'
        values: '1x40'
      - series: 'temporal_cloud_v1_poll_success_count{temporal_namespace="ns.acct",temporal_account="acct",region="aws-us-east-1",temporal_task_queue="orders",task_type="activity",operation="PollActivityTaskQueue"}'
        values: '3x40'
    promql_expr_test:
      - expr: cloudslo:sli_bad:ratio_rate5m{sli="task_delivery"}
        eval_time: 30m
        exp_samples:
          - labels: 'cloudslo:sli_bad:ratio_rate5m{sli="task_delivery",temporal_namespace="ns.acct"}'
            value: 0.25

  # 4. activity_completion resolves even though timeouts carry an extra
  #    `timeout_type` label the other outcomes do not.
  - interval: 1m
    input_series:
      - series: 'temporal_cloud_v1_activity_success_count{temporal_namespace="ns.acct",temporal_account="acct",region="aws-us-east-1",temporal_workflow_type="Order",temporal_task_queue="orders"}'
        values: '3x40'
      - series: 'temporal_cloud_v1_activity_timeout_count{temporal_namespace="ns.acct",temporal_account="acct",region="aws-us-east-1",temporal_workflow_type="Order",temporal_task_queue="orders",timeout_type="StartToClose"}'
        values: '1x40'
    promql_expr_test:
      - expr: cloudslo:sli_bad:ratio_rate5m{sli="activity_completion"}
        eval_time: 30m
        exp_samples:
          - labels: 'cloudslo:sli_bad:ratio_rate5m{sli="activity_completion",temporal_namespace="ns.acct"}'
            value: 0.25
